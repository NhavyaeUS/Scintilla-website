<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Team — Scintilla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Mono:wght@400;500&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFF7DC;cursor:url('Group 129.svg') 12 4,auto}

a,
a *,
button,
button *,
[role="button"],
[role="button"] *,
.st-tab,
.st-tab *,
.st-lip,
.st-slip,
.st-slip * {
  cursor: url('Group 26.svg') 8 2, pointer !important;
}

.st-team{
  --ink:#14264d; --paper:#FFFDF5; --step:clamp(20px,9vw,180px); --tabh:52px;
  position:relative; padding:clamp(56px,9vw,120px) clamp(16px,5vw,64px);
  background:
    radial-gradient(5px 4px at 8% 14%,#FFA62B55 60%,transparent 62%),
    radial-gradient(4px 3px at 22% 70%,#2E5AA744 60%,transparent 62%),
    radial-gradient(6px 4px at 37% 28%,#86C5FF77 60%,transparent 62%),
    radial-gradient(4px 4px at 55% 88%,#FFA62B44 60%,transparent 62%),
    radial-gradient(5px 3px at 68% 18%,#2E5AA733 60%,transparent 62%),
    radial-gradient(6px 5px at 83% 62%,#86C5FF66 60%,transparent 62%),
    radial-gradient(4px 3px at 93% 12%,#FFA62B55 60%,transparent 62%),
    radial-gradient(5px 4px at 47% 50%,#2E5AA722 60%,transparent 62%),
    #FFF7DC;
  color:var(--ink); font-family:"DM Mono",ui-monospace,monospace; overflow:hidden;
}
.st-head{max-width:1120px;margin:0 auto clamp(28px,5vw,56px)}
.st-head h2{font:400 clamp(3.4rem,10vw,8rem)/.9 Anton,Impact,sans-serif;margin:0;letter-spacing:.01em;text-transform:uppercase}
.st-head p{margin:14px 0 0;max-width:100%;white-space:nowrap;font-size:clamp(.82rem,1.35vw,.92rem);line-height:1.6;color:#14264dcc}

.st-stack{max-width:1120px;margin:0 auto;position:relative;z-index:5}
.st-folder{position:relative;margin-top:calc(var(--tabh) * -1 - 38px);--c:#FFA62B;--hv:#86C5FF;--tx:#14264d;pointer-events:none;transition:transform .25s cubic-bezier(.22,1,.36,1)}
.st-folder.lift,.st-folder:hover{transform:translateY(-5px)}
.st-folder.lift:not(:last-child) .st-body,.st-folder:hover:not(:last-child) .st-body{box-shadow:0 -8px 20px #14264d26,inset 0 2px 0 #fff6}
.st-folder:first-child{margin-top:0}
.st-tabrow{height:var(--tabh);display:flex;align-items:flex-end;pointer-events:none;
  padding-left:calc(var(--i) * var(--step) + 26px)}
.st-tab{
  pointer-events:auto;position:relative;height:var(--tabh);padding:0 clamp(22px,3.5vw,46px);
  border:0;border-radius:20px 20px 0 0;background:var(--c);color:var(--tx);cursor:pointer;
  font:600 clamp(.82rem,1.6vw,1rem) "DM Mono",monospace;letter-spacing:.04em;
  display:flex;align-items:center;gap:12px;white-space:nowrap;min-width:clamp(120px,14vw,200px);
  transition:transform .25s cubic-bezier(.22,1,.36,1);
}
.st-tab::before,.st-tab::after{content:"";position:absolute;bottom:0;width:18px;height:18px;pointer-events:none}
.st-tab::before{left:-18px;background:radial-gradient(circle at 0 0,transparent 17.5px,var(--c) 18px)}
.st-tab::after{right:-18px;background:radial-gradient(circle at 100% 0,transparent 17.5px,var(--c) 18px)}
.st-tab i{font-style:normal;font-size:.72rem;background:var(--tx);color:var(--c);border-radius:99px;padding:2px 8px;
  transition:transform .25s cubic-bezier(.22,1,.36,1)}
.st-tab:hover i{transform:scale(1.1)}
.st-tab:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.st-hit{position:absolute;left:0;right:0;top:100%;height:10px}

.st-body{background:var(--c);border-radius:22px 22px 0 0;box-shadow:0 -6px 16px #14264d26,inset 0 2px 0 #fff6;position:relative;padding-bottom:clamp(16px,1.8vw,22px)}
.st-folder:last-child .st-body{border-radius:22px;padding-bottom:clamp(30px,3.8vw,48px)}
.st-lip{height:clamp(54px,6.5vw,76px);cursor:pointer;transition:height .65s cubic-bezier(.65,0,.2,1)}
.st-folder.open .st-lip{height:clamp(16px,2vw,24px)}
.st-panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .65s cubic-bezier(.65,0,.2,1)}
.st-folder.open .st-panel{grid-template-rows:1fr}
.st-inner{min-height:0;overflow:hidden}
.st-content{display:grid;grid-template-columns:minmax(190px,clamp(210px,20vw,300px)) 1fr;gap:clamp(20px,3.5vw,48px);
  padding:0 clamp(18px,3.5vw,44px) calc(var(--tabh) + 22px);color:var(--tx);
  opacity:0;transition:opacity .3s}
.st-folder:last-child .st-content{padding-bottom:clamp(14px,2vw,24px)}
.st-folder.open .st-content{opacity:1;transition-delay:.15s}

.st-label{display:flex;flex-direction:column;gap:6px;align-items:flex-start;position:sticky;top:16px;align-self:start}
.st-label h3{margin:0;font:400 clamp(3.0rem,6.2vw,4.8rem)/.88 Anton,Impact,sans-serif;text-transform:uppercase;letter-spacing:0.01em}
.st-label h3 span{display:block;white-space:nowrap}
.st-note{font-size:clamp(0.78rem,0.88vw,0.86rem);line-height:1.5;max-width:22ch;margin:8px 0 0;opacity:0.88}
.st-planet{display:none}

.st-list{list-style:none;margin:0;padding:0;display:grid;gap:12px;align-content:start;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.st-folder.open .st-slip{animation:st-rise .55s cubic-bezier(.2,.9,.3,1.2) backwards;animation-delay:calc(var(--n) * 45ms + .25s)}
@keyframes st-rise{from{opacity:0;transform:translateY(22px) rotate(2deg)}}
.st-slip{
  position:relative;overflow:hidden;isolation:isolate;background:var(--paper);color:var(--ink);border-radius:6px 16px 6px 16px;
  padding:14px 18px 14px 22px;display:flex;flex-direction:column;gap:6px;box-shadow:3px 3px 0 var(--ink);
  transition:transform .55s cubic-bezier(.22,1,.36,1),box-shadow .55s cubic-bezier(.22,1,.36,1);
}
.st-slip::after{content:"";position:absolute;inset:0;z-index:-1;background:var(--hv);transform:scaleX(0);transform-origin:left center;
  transition:transform .6s cubic-bezier(.22,1,.36,1)}
.st-slip::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--c);z-index:0;
  transition:opacity .4s ease}
.st-nm{font:600 1.15rem/1.2 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.01em;position:relative;z-index:1}
.st-meta{font-size:.74rem;line-height:1.5;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;position:relative;z-index:1}
.st-meta b{font-weight:500;background:var(--ink);color:var(--paper);padding:1px 9px;border-radius:99px;
  transition:background .45s ease,color .45s ease}
.st-slip:hover,.st-slip:focus-within{transform:translateY(-4px) rotate(-.6deg);box-shadow:5px 7px 0 var(--ink)}
.st-slip:nth-child(even):hover{transform:translateY(-4px) rotate(.6deg)}
.st-slip:hover::after,.st-slip:focus-within::after{transform:scaleX(1)}
.st-slip:hover::before{opacity:0}
.st-slip:hover .st-meta b{background:var(--paper);color:var(--ink)}
.st-slip.faculty{padding:18px 20px 18px 24px}
.st-slip.faculty .st-nm{font-size:1.35rem}

@media (max-width:760px){
  .st-content{grid-template-columns:1fr;gap:16px}
  .st-label{flex-direction:row;align-items:flex-end;flex-wrap:wrap;gap:4px 14px;position:static}
  .st-label h3{font-size:2.4rem;line-height:.88}
  .st-label h3 span{display:inline}
  .st-list{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  .st-team *,.st-team *::before{animation:none!important;transition-duration:.01s!important;transition-delay:0s!important}
}
</style>
</head>
<body>

<section class="st-team" id="team" aria-labelledby="st-title">
  <div class="st-head">
    <h2 id="st-title">Our Team</h2>
    <p>Meet the people behind Scintilla: professors, proofreaders and pixel-pushers.</p>
  </div>
  <div class="st-stack" id="stStack"></div>
</section>

<script>
(function(){
  var SAT="https://scintilla.snuchennai.edu.in/assets/image-removebg-preview(3)_1.png",
      PLA="https://scintilla.snuchennai.edu.in/assets/image-removebg-preview(3)_2.png";
  var T=[
   {tab:"Faculty",lines:["FA","CU","LTY"],c:"#FFA62B",hv:"#86C5FF",tx:"#14264d",note:"The professors who keep us on track, and our commas in check.",img:SAT,faculty:true,items:[
     ["Dr. Cherry Mathew","Associate Professor","Department of English"],
     ["Dr. Sruti M D","Assistant Professor","Department of English"]]},
   {tab:"Editorial",lines:["EDI","TOR","IAL"],c:"#86C5FF",hv:"#FFA62B",tx:"#14264d",note:"They read every word twice. Then a third time, just to be sure.",img:PLA,items:[
     ["S. Aditiya Karthikeyan",4,"B.Tech Cyber"],["Dharini Manimaran",4,"B.Tech IoT"],
     ["Ananya R",4,"B.Com PA"],["Lakshmi Sarmishta",4,"B.Com PA"],
     ["Anirudh Srinivasan",4,"B.Tech Cyber"],["Nihma Naser",4,"B.Tech AI & DS"],
     ["Varshitha P",3,"B.Tech CSE (IoT)"],["Deveshii Chauhan V",3,"B.A LL.B"],
     ["Harshitha Jaishankar",3,"B.Com"],["Mangesh Kumar Soni",3,"B.Tech CSE (CS)"],
     ["Ajeetha Jaishankar",3,"B.Tech CSE (CS)"],["Harini S",3,"B.A LL.B"],
     ["Siddharth S",3,"B.Tech CSE (CS)"],["Vibilan D M",3,"B.Tech CSE (IoT)"],
     ["Kailesh S",2,"B.Tech CSE (IoT)"],["Lakshmi Narayanan P",4,"B.Tech CSE (IoT)"],
     ["Sahaana M S",1,"B.Tech CSE (IoT)"],["Archana R",1,"B.Sc Economics"],
     ["Nikhil Nair",1,"B.Sc Economics"],["Keerthana Krishnan",1,"B.Sc Economics"],
     ["Akshaya U G",1,"B.Tech ECE"],["Sesha Dharshini V",1,"B.Sc Economics"],
     ["Shanmathi Ravindran",1,"B.Tech AI & DS"],["Nikila Perumal",1,"B.Tech CSE Core"],
     ["Swarit Singh",1,"B.Sc Economics"]]},
   {tab:"Design",lines:["DE","SI","GN"],c:"#2E5AA7",hv:"#86C5FF",tx:"#FFFDF5",note:"Will nudge it two pixels left. It will be perfect. Probably.",img:SAT,items:[
     ["Siddharth Aravinth",4,"B.Tech Cyber"],["Pranov Shanker",4,"B.Tech IoT"],
     ["Pavithra T. A.",4,"B.Tech AI & DS"],["S. Nittin Balajee",4,"B.Tech Cyber"],
     ["Kavya I.",4,"B.Tech Cyber"],["Dhanyanyaa R",4,"B.Tech AI & DS"],
     ["Vandana Padman",3,"B.Tech CSE (CS)"],["Miruthala Jayakumar",3,"B.Tech AI & DS"],
     ["Hema Varshini",3,"B.Tech IoT"],
     ["Kenneth Santino R",2,"B.Tech CSE (IoT)"],["Varsha G K",2,"B.A LL.B"],
     ["Arnav Guntur",1,"B.Tech Mechanical"],["Vidula Arvind",1,"B.Tech Mechanical"],
     ["Nandhini Sankara Subramanian",1,"B.Tech CSE Core"],["Shivani Sri Muthukumar",1,"B.Tech IT"],
     ["Poorna S",1,"B.Tech CSE Core"],["Prakrithi Sirisilla",1,"B.Tech VLSI"],
     ["Varsha Arun",1,"B.Tech IT"]]},
   {tab:"Event Coverage",lines:["EV","ENT"],c:"#4CAF7D",hv:"#F8E6A0",tx:"#FFFDF5",note:"On the ground, in the moment, getting the story before anyone else does.",img:SAT,items:[
     ["Praijit Mahalingam",1,"Chemical Engineering"],
     ["Adhvaith S",1,"CSE (IoT)"],
     ["Ujwal Karthik Vasepalli",1,"B.A LL.B"],
     ["Hima Teja Varma Uppalapati",1,"CSE (IoT)"],
     ["Prathikka Janakiraman",1,"Biomedical Engineering"],
     ["Rithanya S",1,"Chemical Engineering"],
     ["Harshethaa Sv",1,"CSE (CS)"],
     ["Vamsi Harinii B",1,"ECE"],
     ["Medha Rabindranathnambi",2,"B.A LL.B"]]},
   {tab:"Lead",lines:["LE","AD"],c:"#F8E6A0",hv:"#FFA62B",tx:"#14264d",note:"The ones who say 'quick call?' and mean forty minutes.",img:PLA,items:[
     ["Vikranth",4,"B.Tech CSE Cybersecurity"],["Varsha Pillai M",4,"B.Tech CSE IoT"],
     ["Nhavyae U.S.",3,"B.Tech CSE IoT"],["Srijai S.",3,"B.Tech IoT"]]}
  ];
  var ord={1:"1st",2:"2nd",3:"3rd",4:"4th"}, root=document.getElementById("stStack");
  T.forEach(function(g){if(!g.faculty)g.items.sort(function(a,b){return b[1]-a[1]})});

  root.innerHTML=T.map(function(g,i){
    var slips=g.items.map(function(p,n){
      var meta=g.faculty?'<span>'+p[1]+'</span><span>'+p[2]+'</span>'
                        :'<b>'+ord[p[1]]+' year</b><span>'+p[2]+'</span>';
      return '<li class="st-slip'+(g.faculty?' faculty':'')+'" style="--n:'+n+'"><span class="st-nm">'+p[0]+'</span><span class="st-meta">'+meta+'</span></li>';
    }).join("");
    return '<article class="st-folder'+(i===0?' open':'')+'" style="--c:'+g.c+';--hv:'+g.hv+';--tx:'+g.tx+';--i:'+i+'">'+
      '<div class="st-tabrow"><button class="st-tab" id="st-t'+i+'" aria-expanded="'+(i===0)+'" aria-controls="st-p'+i+'">'+g.tab+'<i>'+g.items.length+'</i><span class="st-hit"></span></button></div>'+
      '<div class="st-body"><div class="st-lip"></div>'+
      '<div class="st-panel" id="st-p'+i+'" role="region" aria-labelledby="st-t'+i+'"><div class="st-inner"><div class="st-content">'+
        '<div class="st-label"><h3 aria-label="'+g.tab+'">'+g.lines.map(function(l){return '<span aria-hidden="true">'+l+'</span>'}).join('')+'</h3>'+
        '<p class="st-note">'+g.note+'</p></div>'+
        '<ul class="st-list">'+slips+'</ul></div></div></div></div></article>';
  }).join("");

  var folders=[].slice.call(root.querySelectorAll(".st-folder")),
      tabs=folders.map(function(f){return f.querySelector(".st-tab")});

  function open(i,forceOpen){
    var was=folders[i].classList.contains("open"), on=forceOpen?true:!was;
    folders.forEach(function(f,k){
      var v=(k===i)?on:false;
      f.classList.toggle("open",v);
      tabs[k].setAttribute("aria-expanded",v);
    });
  }
  folders.forEach(function(f,i){
    var t=tabs[i];
    var body=f.querySelector(".st-body");

    function onEnter(e){
      if(!e.pointerType || e.pointerType==="mouse") f.classList.add("lift");
    }
    function onLeave(e){
      if(e.relatedTarget && f.contains(e.relatedTarget)) return;
      f.classList.remove("lift");
    }

    t.addEventListener("pointerenter",onEnter);
    t.addEventListener("pointerleave",onLeave);
    if(body){
      body.addEventListener("pointerenter",onEnter);
      body.addEventListener("pointerleave",onLeave);
    }

    t.addEventListener("focus",function(){if(t.matches(":focus-visible"))f.classList.add("lift")});
    t.addEventListener("blur",function(){f.classList.remove("lift")});
    t.addEventListener("click",function(){open(i)});
    var lip=f.querySelector(".st-lip");
    if(lip)lip.addEventListener("click",function(){open(i)});
    t.addEventListener("keydown",function(e){
      var d={ArrowDown:1,ArrowRight:1,ArrowUp:-1,ArrowLeft:-1}[e.key];
      if(d){e.preventDefault();var j=(i+d+tabs.length)%tabs.length;tabs[j].focus();open(j,true)}
    });
  });
})();
</script>
</body>
</html>
